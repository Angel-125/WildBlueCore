name: Release Bot Access Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-access:
    name: Verify GitHub App repository access
    runs-on: ubuntu-24.04

    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.WBI_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WBI_RELEASE_APP_PRIVATE_KEY }}
          owner: Angel-125
          repositories: WildBlueCore,SunkWorks,Buffalo2,Sandcastle
          permission-contents: write

      - name: Verify read access without changing repositories
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          for repository in WildBlueCore SunkWorks Buffalo2 Sandcastle; do
            full_name="$(gh api "repos/Angel-125/${repository}" --jq '.full_name')"
            default_branch="$(gh api "repos/Angel-125/${repository}" --jq '.default_branch')"
            echo "Verified access to ${full_name} (default branch: ${default_branch})."
            echo "- ${full_name}: access verified" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This check made no repository changes." >> "$GITHUB_STEP_SUMMARY"
